name: Discover events

on:
  workflow_dispatch:
  schedule:
    # Daily at 04:23 UTC. The radar picks the result up on its next run.
    - cron: "23 4 * * *"
  push:
    branches: [main]
    paths: ["scripts/discover-events.mjs", "config/discover-events.json"]

permissions:
  contents: write
  actions: write

concurrency:
  group: geo-radar-discover-events
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 200
      - name: Skip if already refreshed (the Worker starts this on time; GitHub's schedule is a late fallback)
        id: guard
        run: |
          last=$(git log -1 --format=%ct -- data/events-discovered.json 2>/dev/null || echo 0)
          age=$(( $(date +%s) - ${last:-0} ))
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$age" -lt 79200 ]; then echo "skip=true" >> "$GITHUB_OUTPUT"; echo "Refreshed $((age/3600)) h ago; skipping."; fi
      - uses: actions/setup-node@v4
        if: steps.guard.outputs.skip != 'true'
        with:
          node-version: 22
      - name: Find events at societies and related organisations
        if: steps.guard.outputs.skip != 'true'
        run: node scripts/discover-events.mjs | tee discover-events.log
      - name: Commit result
        if: steps.guard.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p data
          tail -n 400 discover-events.log | head -c 60000 > data/discover-events-log.txt
          git add data/events-discovered.json data/discover-events-log.txt
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "discover: refresh events"
            git pull --rebase -q
            git push
          fi
      - name: Start the radar so the new data goes live now
        if: steps.guard.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run radar.yml --ref main
