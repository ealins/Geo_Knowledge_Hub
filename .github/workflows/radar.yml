name: Geo Radar

on:
  workflow_dispatch:
  schedule:
    # Fallback only: GitHub skips or delays many scheduled runs. The Cloudflare Worker starts this workflow every hour.
    - cron: "17 */2 * * *"
  push:
    branches: [main]
    paths: ["config/**", "scripts/**", "site/**", "wrangler.jsonc", "worker/**", "package.json", ".github/workflows/radar.yml"]

permissions:
  contents: write

concurrency:
  group: geo-radar
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Worker dependencies
        run: npm install --no-audit --no-fund

      - name: Install Playwright (drives the Chrome already on the runner)
        run: npm install --no-save --no-audit --no-fund playwright@1.48.2

      - name: Fetch sources and update feed
        env:
          REED_API_KEY: ${{ secrets.REED_API_KEY }}
        run: node scripts/radar.mjs

      - name: Place items on the map (free geocoding, cached)
        continue-on-error: true
        run: node scripts/geocode.mjs

      - name: Commit feed if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No feed changes."
          else
            git commit -m "radar: refresh feed"
            # A run can start on an older checkout than main (queued behind another run), so rebase first;
            # on a data conflict keep this run's freshly generated files.
            git pull --rebase -X theirs origin main
            git push
          fi

      - name: Build site
        run: node scripts/build.mjs

      - name: Deploy Worker to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx -y wrangler@4 deploy
